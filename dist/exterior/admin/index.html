<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>პროექტები — LITHOS</title><link rel="stylesheet" href="../exterior.css"><style>main{padding-block:35px}h1{font-size:30px}#login-form{max-width:500px;margin-top:28px}label{font-size:12px}input{margin:8px 0 20px}.admin-top,.admin-controls{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:25px 0}.admin-controls{max-width:700px}.admin-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:25px}.lead-list{list-style:none;padding:0;margin:0}.lead-button{width:100%;text-align:left;background:var(--white);border-bottom:1px solid var(--line);padding:17px;font-size:12px}.lead-button.selected{border-left:3px solid var(--bronze)}.lead-button>span{display:block;font-size:10px;color:var(--muted)}#detail{background:var(--white);padding:24px}#detail:empty{display:none}.admin-images{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.admin-images img{width:100%;height:180px;object-fit:contain}#detail p{font-size:12px;margin:10px 0}#detail h2{font-size:22px}#detail textarea{margin:12px 0}#detail select{margin:20px 0}.admin-actions{display:flex;justify-content:space-between;gap:15px}.admin-empty{margin:30px 0;color:var(--muted);font-size:12px}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin-controls{flex-wrap:wrap}.admin-images img{height:140px}}</style><script src="../config.js" defer></script><script type="module" src="admin.mjs"></script></head><body><header class="site-header"><a href="../../" class="brand"><img src="../../assets/lithos-logo-v1.webp" width="92" height="76" alt="LITHOS"></a><span class="studio-wordmark">ექსტერიერის სტუდია / პროექტები</span><a class="header-cta" href="../">სტუდიაში დაბრუნება ↗</a></header><main class="shell"><div class="admin-top"><h1>პროექტების მართვა</h1><button id="logout" class="text-button" hidden>გასვლა</button></div><form id="login-form"><label>ადმინისტრატორის წვდომის კოდი<input id="admin-token" type="password" autocomplete="off" minlength="48" required></label><button class="button dark" type="submit">შესვლა ↗</button><p class="admin-empty">წვდომის კოდი გამოიყენება მხოლოდ ამ სესიაში. პროექტების ფოტოები და საკონტაქტო ინფორმაცია ავტორიზაციის გარეშე არ იტვირთება.</p></form><p id="status" class="feedback" role="status" aria-live="polite"></p><section id="dashboard" hidden><div class="admin-controls"><label for="status-filter">სტატუსი</label><select id="status-filter"><option value="">ყველა სტატუსი</option></select><button id="refresh" class="button outline" type="button">განახლება ↻</button></div><p class="admin-empty" id="list-note">ბოლო 100 მოქმედი მოთხოვნა.</p><div class="admin-grid"><ul id="leads" class="lead-list"></ul><div id="detail"></div></div></section></main></body></html>
