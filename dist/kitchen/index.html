<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="დახაზე ოთახი ან ააწყე სამზარეულო ნაბიჯ-ნაბიჯ: LITHOS-ის ქვა, 3D ხედი, ქვის რაოდენობა, ფილები და საორიენტაციო ფასი.">
<meta name="robots" content="index,follow">
<meta name="lithos-tex" content="1024">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" crossorigin>
<title>LITHOS სამზარეულოს დიზაინერი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Layout: step panel on the left (≤440px) + live 3D stage on the right; on phones the stage sticks on top and the panel scrolls under it */
  --paper:#f3f0e9; --surface:#fbf9f4; --sunk:#ebe7de; --ink:#252923; --muted:#656a61; --line:#d7d3c7; --line-strong:#b5b1a4;
  --accent:#727c55; --accent-ink:#4a5235; --accent-soft:#e3e6d6; --primary:#2f382c; --on-primary:#f6f4ee;
  --error:#a03a25; --error-soft:#f5e1d9; --warn:#8a6110; --warn-soft:#f3e8cf; --info:#46606c; --info-soft:#e0e8eb;
  --stage:#e4e0d6; --overlay:rgba(251,249,244,.93);
  --f-ui:'Noto Sans Georgian','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161815; --surface:#1d201c; --sunk:#262a24; --ink:#e9e6dd; --muted:#a0a397; --line:#353930; --line-strong:#4d5247;
  --accent:#a8b285; --accent-ink:#c9d1aa; --accent-soft:#2b3123; --primary:#dfe4cc; --on-primary:#1a1d17;
  --error:#e48a72; --error-soft:#3a221b; --warn:#dcb05c; --warn-soft:#352c19; --info:#94b3c0; --info-soft:#1e292d;
  --stage:#20231f; --overlay:rgba(29,32,28,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161815; --surface:#1d201c; --sunk:#262a24; --ink:#e9e6dd; --muted:#a0a397; --line:#353930; --line-strong:#4d5247;
  --accent:#a8b285; --accent-ink:#c9d1aa; --accent-soft:#2b3123; --primary:#dfe4cc; --on-primary:#1a1d17;
  --error:#e48a72; --error-soft:#3a221b; --warn:#dcb05c; --warn-soft:#352c19; --info:#94b3c0; --info-soft:#1e292d;
  --stage:#20231f; --overlay:rgba(29,32,28,.92); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num-f,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand .mark{font-weight:600;letter-spacing:.34em;font-size:15px}
.brand .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:10px}
.save-state{font-size:11.5px;color:var(--muted)}
.work{min-height:0;display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);grid-template-areas:"panel stage"}
.panel{grid-area:panel;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface)}
.stage{grid-area:stage;position:relative;min-height:0;background:var(--stage);overflow:hidden}
.canvas-wrap{position:absolute;inset:0}
.canvas-wrap canvas{width:100%;height:100%;display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;will-change:transform;transform:translate(-50%,-100%);background:var(--overlay);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font:500 11px/1.5 var(--f-num);white-space:nowrap}
.lbl b{font-family:var(--f-ui);font-weight:600;margin-right:4px}
.views{position:absolute;left:12px;top:12px;display:flex;gap:2px;background:var(--overlay);border:1px solid var(--line);border-radius:999px;padding:3px}
.views button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12px;color:var(--muted)}
.views button.on{background:var(--primary);color:var(--on-primary)}
.stage-tools{position:absolute;right:12px;top:12px;display:flex;gap:10px;background:var(--overlay);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px}
.stage-tools label{display:flex;align-items:center;gap:5px;cursor:pointer}
.stage-stats{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--overlay);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px}
.chip .mono{font-size:12px}
button.chip{cursor:pointer}
.chip.err{color:var(--error);border-color:color-mix(in srgb,var(--error) 40%,var(--line))}
.chip.wrn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:24px}

.steps{display:flex;gap:2px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:999px;padding:5px 10px 5px 5px;font-size:12.5px;color:var(--muted);position:relative}
.steps button .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:500 11px var(--f-num);border:1px solid var(--line-strong)}
.steps button.on{color:var(--ink);border-color:var(--line);background:var(--sunk)}
.steps button.on .n{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.steps button .flag{position:absolute;top:2px;left:20px;width:7px;height:7px;border-radius:50%}
.flag.err{background:var(--error)}.flag.wrn{background:var(--warn)}
.step-body{flex:1;min-height:0;overflow-y:auto;padding-block:18px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.step-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.step-nav .count{font:12px var(--f-num);color:var(--muted)}

h2.st{font-size:20px;font-weight:500;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--muted);font-size:13px;margin:0 0 16px;max-width:60ch}
.sec{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.sec>h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-ink);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid2>.full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f-l{font-size:12px;color:var(--ink);font-weight:500}
.f-h{font-size:11.5px;color:var(--muted);line-height:1.5}
.num{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);overflow:hidden}
.num:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.num input{flex:1;min-width:0;border:0;background:none;padding:8px 10px;font-family:var(--f-num);font-size:13.5px;outline:none}
.num .u{display:grid;place-items:center;padding:0 10px;font-size:11.5px;color:var(--muted);background:var(--sunk);border-left:1px solid var(--line)}
.num input::placeholder{color:var(--muted);font-family:var(--f-ui)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--paper);border-radius:var(--radius);padding:6px 10px;font-size:12.5px;min-height:34px}
.seg button svg{flex:0 0 auto}
.seg button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);padding:0;position:relative}
.sw button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sw button.same{width:auto;border-radius:999px;padding:0 10px;font-size:12px;background:var(--paper)}
.sw button.same.on{background:var(--primary);color:var(--on-primary);box-shadow:none}
.sw-name{font-size:11.5px;color:var(--muted);margin-top:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:500}
.toggle input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(16px)}
.btn{border:1px solid var(--line-strong);background:var(--paper);border-radius:var(--radius);padding:7px 12px;font-size:12.5px;min-height:34px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.plan{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
.plan svg{width:100%;height:auto;display:block}
.notes{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;border-radius:var(--radius);padding:8px 10px;line-height:1.5}
.note .dot{margin-top:6px;flex:0 0 auto}
.note.error{background:var(--error-soft);color:var(--error)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.note span{color:var(--ink)}
.note button{margin-left:auto;border:0;background:none;color:inherit;text-decoration:underline;font-size:12px;flex:0 0 auto}

.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);padding:6px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.slot.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.slot img,.slot .ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--sunk);max-width:100%}
.slot .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.slot .v{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .same-l{font-size:11.5px;color:var(--muted)}
.mat-tools{display:flex;flex-direction:column;gap:8px;margin:12px 0 8px}
.search{border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);padding:8px 10px;width:100%}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.filters button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--muted)}
.filters button.on{border-color:var(--ink);color:var(--ink);background:var(--sunk)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.mcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:4px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--sunk);max-width:100%}
.mcard .nm{font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .br{font-size:10px;color:var(--muted);letter-spacing:.06em}
.mcard.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.minfo{font-size:12px;color:var(--muted);margin-top:6px}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.preset{border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.preset.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.preset .pal{display:flex;height:22px;border-radius:4px;overflow:hidden}
.preset .pal i{flex:1}
.preset span{font-size:12px;font-weight:500}

.runtabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.mods{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:22px minmax(0,1fr) 92px auto;gap:6px;align-items:center}
.mrow .i{font:11px var(--f-num);color:var(--muted);text-align:right}
.mrow select{border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);padding:6px 6px;min-width:0;font-size:12.5px}
.mrow .num input{padding:6px 6px;font-size:12.5px}
.mrow .num .u{padding:0 6px}
.mrow .acts{display:flex;gap:2px}
.mrow .acts button{border:1px solid var(--line);background:var(--paper);border-radius:5px;width:28px;height:30px;font-size:12px;padding:0}
.mrow.locked{opacity:.7}
.mrow.locked .lk{font-size:12px;color:var(--muted)}
.msum{display:flex;justify-content:space-between;font-size:12px;margin-top:8px;color:var(--muted)}
.msum b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.msum.bad b{color:var(--error)}

.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.metric{background:var(--sunk);border-radius:var(--radius);padding:10px 12px}
.metric .k{font-size:11px;color:var(--muted)}
.metric .v{font:500 20px/1.3 var(--f-num);margin-top:2px}
.metric .v small{font-size:12px;color:var(--muted);margin-left:3px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:6px 0;border-bottom:1px solid var(--line)}
table.t td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.t tr.tot td{font-weight:600;border-bottom:0}
.slab{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.slab .s1{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.slab .s2{color:var(--muted);font-size:11.5px}
.total{font:500 24px/1.3 var(--f-num);margin:10px 0 2px}
.fine{font-size:11.5px;color:var(--muted);line-height:1.6}
textarea.code{width:100%;min-height:120px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);padding:8px;font:11.5px/1.5 var(--f-num);resize:vertical}
.shot{width:100%;max-width:100%;border-radius:var(--radius);border:1px solid var(--line);display:block}
details.more{margin-top:8px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--accent-ink)}
.ergo{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ergo b{font-family:var(--f-num);color:var(--ink);font-weight:500}

.modebar{padding:10px 12px 0}
.modebar .seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.modebar .seg button{border:0;border-radius:0;min-height:32px;justify-content:center;font-size:12.5px;background:var(--paper)}
.modebar .seg button.on{background:var(--primary);color:var(--on-primary)}
.sketch{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px}
.sketch svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.sketch .feat{cursor:grab}
.sketch .feat:focus{outline:none}
.sketch .feat:focus-visible circle:last-child{stroke:var(--accent)}
.tools{margin-top:8px}
.fcards{display:flex;flex-direction:column;gap:8px}
.fcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.fcard.sel{border-color:var(--ink)}
.fhead{display:flex;align-items:center;gap:8px;font-size:12.5px}
.fhead b{font-weight:500}
.fhead select{margin-left:auto;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);padding:4px 6px;font-size:12px;min-width:0}
.fhead .x{border:1px solid var(--line);background:var(--surface);border-radius:5px;width:28px;height:28px;padding:0}
.ficon{width:12px;height:12px;border-radius:2px;flex:0 0 auto;background:var(--ink)}
.ficon.window{background:var(--info)}.ficon.water{background:var(--info);border-radius:50%}.ficon.door{background:none;border:1.5px solid var(--muted);border-radius:0 10px 0 0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.mini{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.mini .num input{padding:5px 6px;font-size:12.5px}
.mini .num .u{padding:0 6px}
.auto-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.auto-list li{position:relative;padding-left:20px;font-size:12.5px;line-height:1.5}
.auto-list li::before{content:"";position:absolute;left:2px;top:6px;width:9px;height:5px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
@media (max-width:860px){
  .app{height:auto;min-height:100%;display:block}
  .work{display:flex;flex-direction:column}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);height:44vh;min-height:260px;z-index:5;order:-1;border-bottom:1px solid var(--line)}
  .panel{border-right:0}
  .step-body{overflow:visible}
  .step-nav{position:sticky;bottom:0;z-index:4}
  .brand .sub{display:none}
  .views button{padding:4px 8px;font-size:11.5px}
  .stage-tools{top:auto;bottom:12px;right:12px;padding:4px 10px}
  .stage-stats{bottom:52px}
}
@media (max-width:520px){.save-state{display:none}}
@media (max-width:420px){.grid2{grid-template-columns:minmax(0,1fr)}.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.slots{grid-template-columns:repeat(3,minmax(0,1fr))}.metric .v{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="/neolith-data.js"></script>
<script src="/quartz-data.js"></script>
<script src="/designer/config.js"></script>

<body>
<div class="app">
  <header class="top">
    <div class="brand"><a class="mark" href="/" style="color:inherit;text-decoration:none">LITHOS</a><span class="sub">სამზარეულოს დიზაინერი · ქვა, ზომები, 3D</span></div>
    <div class="top-actions"><span class="save-state" id="saveState"></span><button class="btn ghost" type="button" id="btnReset">თავიდან დაწყება</button></div>

/* ---- camera views ---- */
function viewTarget(name) {
  const M = model, W = M.RW, Dd = M.RD, fov = (camera.fov * Math.PI) / 180, asp = camera.aspect;
  if (name === 'top') { const span = Math.max(W / asp, Dd) * 1.6; const d = span / 2 / Math.tan(fov / 2); return { p: [W / 2, d, Dd / 2 + 1], c: [W / 2, 0, Dd / 2] }; }
  if (name === 'front') { const span = Math.max(W * 1.12 / asp, 200); const d = span / 2 / Math.tan(fov / 2); return { p: [W / 2, 150, Math.min(d, 1500)], c: [W / 2, 130, 0] }; }
  if (name === 'island' && M.isl) { const I = M.isl, back = Math.min(I.z1 + 260, Dd + 120); return { p: [I.cx + 70, 210, back], c: [I.cx, 105, M.D * 0.5] }; }
  const span = Math.max(W, Dd) * 1.05; const d = Math.max(340, span / 2 / Math.tan(fov / 2) * (asp < 1 ? 2.1 : 0.95));
  return { p: [W * 0.5 + d * 0.4, 130 + d * 0.5, Dd * 0.42 + d * 0.84], c: [W / 2, 95, Dd * 0.34] };
}
function setView(name, instant) {

  document.querySelectorAll('.views button').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  const v = viewTarget(name);

  if (instant) { camera.position.copy(p1); controls.target.copy(c1); controls.update(); needsRender = true; labelsDirty = true; return; }
  tween = { t0: performance.now(), dur: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 650, p0: camera.position.clone(), p1, c0: controls.target.clone(), c1 };
}
function snapshot(w = 1024, h = 768) {
  const size = renderer.getSize(new T.Vector2()), pr = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();

}

async function toJpegB64(src, max) {

  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.88).split(',')[1];
}

function materialize(id) { if (!Array.isArray(S.mods[id])) S.mods[id] = model.items[id].map(m => ({ t: m.t, w: r1(m.w) })); return S.mods[id]; }

const body = $('#stepBody');
body.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'matSearch') { ui.q = t.value; $('#matGrid').innerHTML = gridHTML(); return; }
  if (t.dataset.kind !== 'num') return;
  const p = t.dataset.path, raw = t.value.trim();
  if (raw === '') { if (NULLABLE.has(p)) { set(p, null); update(false); } return; }
  const v = Number(raw.replace(',', '.')); if (!Number.isFinite(v)) return;
  set(p, v); afterSet(p); update(false);
});
body.addEventListener('change', e => {
  const t = e.target, a = t.dataset.act;
  if (t.dataset.kind === 'tog') { set(t.dataset.path, t.checked); afterSet(t.dataset.path); update(true); return; }
  if (a === 'feat') { const f = S.feats[+t.dataset.i], v = Number(t.value); if (f && Number.isFinite(v)) { f[t.dataset.k] = Math.max(0, v); update(false); } return; }
  if (a === 'featwall') { const f = S.feats[+t.dataset.i]; if (f) { f.wall = t.value; update(false); } return; }
  if (a === 'mod-t' || a === 'mod-w') {
    const list = materialize(ui.cabRun), i = +t.dataset.i;
    if (a === 'mod-t') list[i].t = t.value; else { const v = Number(t.value); if (Number.isFinite(v) && v > 0) list[i].w = v; }
    update(false);
  }
});
body.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.kind === 'seg') { const p = b.dataset.path; set(p, JSON.parse(b.dataset.v)); afterSet(p); update(true); return; }
  const a = b.dataset.act, v = b.dataset.v; if (!a) return;
  switch (a) {
    case 'ergo': S.base.top = +v; update(true); break;
    case 'cabrun': ui.cabRun = v; renderStep(); break;
    case 'mod-up': case 'mod-dn': { const list = materialize(ui.cabRun), i = +b.dataset.i, j = a === 'mod-up' ? i - 1 : i + 1; [list[i], list[j]] = [list[j], list[i]]; update(false); break; }
    case 'mod-del': { const list = materialize(ui.cabRun); list.splice(+b.dataset.i, 1); update(false); break; }
    case 'mod-add': { const list = materialize(ui.cabRun); list.push({ t: 'door', w: 40 }); update(false); break; }
    case 'mod-auto': S.mods[ui.cabRun] = null; update(true); break;
    case 'pick': ui.pick = v; renderStep(); break;
    case 'pick-same': set(ui.pick === 'bs' ? 'stone.bsMat' : 'stone.islMat', null); update(true); break;
    case 'mat': { const p = ui.pick === 'main' ? 'stone.main' : ui.pick === 'bs' ? 'stone.bsMat' : 'stone.islMat'; set(p, v); afterSet(p); update(true); break; }
    case 'fbrand': ui.brand = v; renderStep(); break;
    case 'ftone': ui.tone = ui.tone === v ? null : v; renderStep(); break;
    case 'preset': { const p = PRESETS[v]; Object.assign(S.front, clone(p.front), { preset: v }); Object.assign(S.int, clone(p.int)); update(true); break; }
    case 'goto': go(+v); break;
    case 'copy': copyFrom($('#' + b.dataset.src), b.nextElementSibling?.classList.contains('fine') ? b.nextElementSibling : null); break;
    case 'import': {
      const msg = $('#importMsg');
      try { S = sanitize(JSON.parse($('#jsonBox').value)); update(true); $('#importMsg') && ($('#importMsg').textContent = 'პროექტი ჩაიტვირთა.'); }
      catch { msg.textContent = 'JSON ვერ წავიკითხე — შეამოწმე ტექსტი.'; }
      break;
    }
    case 'share': {
      const msg = $('#shareMsg');
      if (!shareLink) { msg.textContent = 'ბმული მზადდება, სცადე წამში.'; break; }
      const box = Object.assign(document.createElement('textarea'), { value: shareLink }); box.className = 'code'; box.style.minHeight = '60px';
      navigator.clipboard.writeText(shareLink).then(() => { msg.textContent = 'ბმული დაკოპირდა.'; }, () => { msg.textContent = 'მონიშნე და დააკოპირე:'; msg.after(box); box.select(); });
      break;
    }
    case 'shot': if (!threeReady) break; ui.shot = snapshot(); $('#shotBox').innerHTML = `<img class="shot" src="${ui.shot}" alt="3D კადრი AI-სთვის, 1024×768"><p class="fine">შეინახე სურათი (მარჯვენა ღილაკი ან ხანგრძლივი შეხება) და ატვირთე AI Studio-ში ქვის ფოტოსთან ერთად.</p>`; break;
    case 'gen': generate(); break;
    case 'flow': switchFlow(v); break;
    case 'restore': if (ui.fullBackup) { S = ui.fullBackup; ui.fullBackup = null; S.flow = 'full'; step = 1; update(true); } break;
    case 'skwall': S.sk.walls[v] = !S.sk.walls[v]; update(true); break;
    case 'addfeat': {
      const d = FEAT[v], W0 = S.room.w, D0 = S.room.d;
      const f = v === 'window' ? { t: v, wall: 'back', x: Math.max(0, Math.round(W0 / 2 - 60)), w: 120, h: d.h, sill: d.sill }
        : v === 'door' ? { t: v, wall: 'right', x: Math.max(0, D0 - 130), w: 90, h: 210 }
        : v === 'column' ? { t: v, wall: 'back', x: Math.max(0, W0 - 40), w: 40, d: 40 } : { t: v, wall: 'back', x: Math.round(W0 / 2) };
      S.feats.push(f); ui.selFeat = S.feats.length - 1; update(false); break;
    }
    case 'featdel': S.feats.splice(+b.dataset.i, 1); ui.selFeat = null; update(false); break;
    case 'rot': rotateRoom(S); ui.selFeat = null; update(true); break;
  }
});
function switchFlow(v) {
  if (v === S.flow) return;
  if (v === 'quick') ui.fullBackup = clone(S);
  S.flow = v; step = v === 'quick' ? 0 : 1; update(true); go(step);
}
$('#modebar').addEventListener('click', e => { const b = e.target.closest('[data-flow]'); if (b) switchFlow(b.dataset.flow); });
/* sketch: drag features along (and between) walls */
function sketchPoint(e) {
  const svg = $('#sketchSvg'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse()), g = sketchGeom();
  return { x: (p.x - g.pad) / g.sc, z: (p.y - g.pad) / g.sc };
}
body.addEventListener('pointerdown', e => {
  const el = e.target.closest('#sketchSvg .feat'); if (!el) return;
  e.preventDefault(); const i = +el.dataset.fi;
  ui.drag = { i, moved: false, sx: e.clientX, sy: e.clientY }; ui.selFeat = i;
  $('#sketchSvg').setPointerCapture(e.pointerId);
});
/* pointer events can fire faster than the screen refreshes: handle at most one per frame */
let dragEvt = null;
body.addEventListener('pointermove', e => {
  if (!ui.drag) return;
  if (!ui.drag.moved && Math.hypot(e.clientX - ui.drag.sx, e.clientY - ui.drag.sy) < 4) return;
  if (!dragEvt) requestAnimationFrame(() => { const ev = dragEvt; dragEvt = null; if (ev && ui.drag) dragTo(ev); });
  dragEvt = { clientX: e.clientX, clientY: e.clientY };
});
function dragTo(e) {
  ui.drag.moved = true;
  const f = S.feats[ui.drag.i]; if (!f) return;
  const { x, z } = sketchPoint(e), W0 = S.room.w, D0 = S.room.d;
  const dist = { back: z, left: x, right: W0 - x, front: D0 - z };
  const allowed = f.t === 'door' || f.t === 'column' ? ['back', 'left', 'right', 'front'] : ['back', 'left', 'right'];
  const wall = allowed.reduce((m, k) => (dist[k] < dist[m] ? k : m), allowed[0]);
  const len = wall === 'back' || wall === 'front' ? W0 : D0, along = wall === 'back' || wall === 'front' ? x : z, w = f.w || 0;
  const nx = Math.round(clamp(along - w / 2, 0, Math.max(0, len - w)) / 5) * 5;
  if (f.wall === wall && f.x === nx) return;
  f.wall = wall; f.x = nx;
  update(false);
}
const endDrag = () => { if (!ui.drag) return; const d = ui.drag; ui.drag = null; if (!d.moved) refreshLive(); else scheduleRebuild(0); };
body.addEventListener('pointerup', endDrag); body.addEventListener('pointercancel', endDrag);
body.addEventListener('keydown', e => {
  const el = e.target.closest?.('#sketchSvg .feat'); if (!el) return;
  const f = S.feats[+el.dataset.fi]; if (!f) return;
  const step5 = { ArrowLeft: -5, ArrowUp: -5, ArrowRight: 5, ArrowDown: 5 }[e.key]; if (!step5) return;
  e.preventDefault(); f.x = Math.max(0, f.x + step5); ui.selFeat = +el.dataset.fi; update(false);
  requestAnimationFrame(() => $(`#sketchSvg .feat[data-fi="${el.dataset.fi}"]`)?.focus());
});
$('#steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) go(+b.dataset.step); });
$('#stageStats').addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b) go(+b.dataset.goto); });
$('#prev').addEventListener('click', () => go(step - 1));
$('#next').addEventListener('click', () => go(step + 1));
document.querySelector('.views').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
$('#tgDims').addEventListener('change', () => { labelsDirty = true; });
$('#tgUpper').addEventListener('change', e => { if (upperGroup) { upperGroup.visible = e.target.checked; renderer.shadowMap.needsUpdate = true; needsRender = true; } });
let resetArmed = 0;
$('#btnReset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!resetArmed) { b.textContent = 'დააჭირე კიდევ ერთხელ'; resetArmed = setTimeout(() => { resetArmed = 0; b.textContent = 'თავიდან დაწყება'; }, 3000); return; }
  clearTimeout(resetArmed); resetArmed = 0; b.textContent = 'თავიდან დაწყება';
  S = clone(DEFAULTS); ui.pick = 'main'; ui.shot = null; update(true); go(0);
});

(async function boot() {
  let src = null;
  if (location.hash.startsWith('#p.')) { try { src = await decodeProject(location.hash.slice(3)); } catch { src = null; } }
  if (!src) src = storeLoad();
  S = sanitize(src);
  model = computeModel(S); normalize(); model = computeModel(S);
  renderSteps(); renderStep(); renderStats();
  if (src) $('#saveState').textContent = 'შენახულია ამ ბრაუზერში';
  update(true);
  init3D().catch(err => { $('#loading').textContent = '3D ხედი ვერ ჩაიტვირთა. მენიუ და გამოთვლები მაინც მუშაობს. (' + err.message + ')'; });
})();
</script>
